name: drivedesk

# SQLite mode (current). The Flask app stores its database on the
# "sqlite" named volume mounted at /app/backend/instance.
#
# PostgreSQL mode: uncomment the "db" service below, the DATABASE_URL
# line in the app service, the db depends_on block and the pgdata
# volume, then set POSTGRES_* values in .env.

services:
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-drivedesk}
  #     POSTGRES_USER: ${POSTGRES_USER:-drivedesk}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drivedesk} -d ${POSTGRES_DB:-drivedesk}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL: postgresql://${POSTGRES_USER:-drivedesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-drivedesk}
      UPLOAD_FOLDER: /data/uploads
      FRONTEND_FOLDER: /app/prototype
    volumes:
      - sqlite:/app/backend/instance
      - uploads:/data/uploads
    # depends_on:
    #   db:
    #     condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  # pgdata:
  sqlite:
  uploads:
  caddy_data:
  caddy_config:
